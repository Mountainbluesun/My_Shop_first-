
{% extends 'base.html' %}
{% load i18n %}

{% block content %}

    <h1>{% trans "Log in" %}</h1>
    <form method="POST">
        {% csrf_token %}
        <p>
           <label for="email">{% trans "Email" %}</label>
           <input id="email" type="email" name="email">
        </p>
        <p>
            <label for="password">{% trans "Password" %}</label>
            <input id="password" type="password" name="password">
        </p>
        <button type="submit">{% trans "Log in" %}</button>
    </form>


{% endblock %}
